<title>角色名冊・後台</title>

<style>
/* Admin: same paper, greys and #aaa55a as the public site, stripped to a calm data-entry tool. */
:root{color-scheme:light;--bg:#ececec;--card:#fafafa;--ink:#282828;--mute:#888;--line:#e4e4e4;--acc:#aaa55a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px max(4vw,16px);background:var(--card);border-bottom:1px solid #d9d9d9}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.1em}
header h1 small{font-weight:400;color:var(--mute);letter-spacing:0;margin-left:6px}
header .sp{flex:1}
#who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.lnk{border:0;background:none;color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;font-size:13px}
.lnk:hover{color:var(--ink)}
#app{max-width:1180px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.center{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid #dcdcdc;padding:32px 28px;text-align:center}
.center h2{margin:0 0 6px;font-size:20px}.center p{color:#666;margin:0 0 18px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid #d6d6d6;margin-bottom:18px}
.tabs button{flex:none;border:0;background:none;padding:10px 18px;min-height:44px;color:var(--mute);font-weight:700;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.fcol,.lcol,.imp{background:var(--card);border:1px solid #dcdcdc;padding:18px 20px}
.fcol{position:sticky;top:12px}
.fhead{grid-column:1/-1;display:flex;align-items:baseline;gap:12px}
.fhead h2,.lhead h2,.imp h2{margin:0;font-size:16px}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:3px}.fld.wide{grid-column:1/-1}
.fld label,.fld .lbl{font-size:12px;color:#666;font-weight:700}
.fld input,.fld select,.fld textarea,.ltools input,.ltools select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid #d4d4d4;background:#fafafa;color:var(--ink);min-height:42px;border-radius:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.ltools input:focus{outline:none;border-color:var(--acc)}
.fld textarea{resize:vertical;line-height:1.6}
.imgrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pv{flex:none;width:72px;height:72px;background:#f0f0f0 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:#bbb;font-size:12px}
.btn{background:var(--ink);color:#fafafa;border:1px solid var(--ink);padding:8px 20px;min-height:42px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fafafa;color:var(--ink);border-color:#cfcfcf}
.btn.danger{color:#a33;border-color:#dcbcbc}
.filebtn{display:inline-flex;align-items:center}
.acts{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;margin-top:4px}
.msg{font-size:13px;color:#a33}
.lhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.cnt{font-size:13px;color:var(--mute)}
.ltools{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px;margin-bottom:10px}
.list{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list .none{padding:14px 4px;color:var(--mute)}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:8px 6px;min-height:48px}
.item:hover{background:#f2f2f2}.item.sel{background:#efeee2;box-shadow:inset 3px 0 var(--acc)}
.item:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.th{flex:none;width:38px;height:38px;background:#eee center/cover no-repeat;border:1px solid var(--line)}
.item .main{flex:1;display:flex;flex-direction:column}
.item b{font-weight:700;font-size:15px;line-height:1.35}
.item i{font-style:normal;font-size:12px;color:var(--mute);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{flex:none;font-size:12px;color:#666;text-align:right;line-height:1.45}
.imp{max-width:640px}.imp p{color:#555;margin:6px 0 14px}
.imp table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:14px}
.imp th,.imp td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
.imp td:nth-child(2),.imp td:nth-child(3){text-align:right}
.imp th{font-size:12px;color:#666}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fafafa;padding:9px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.fcol{position:static}.list{max-height:none}}
@media(max-width:520px){.frm{grid-template-columns:minmax(0,1fr)}}
#crop{position:fixed;inset:0;z-index:40;background:rgb(40 40 40/.55);display:none;align-items:center;justify-content:center;padding:16px}
#crop.on{display:flex}
.cropbox{background:var(--card);width:min(420px,100%);padding:18px 18px 16px;border:1px solid #d6d6d6}
.cropbox h2{margin:0 0 4px;font-size:16px}.cropbox p{margin:0 0 12px;font-size:13px;color:var(--mute)}
#cropStage{position:relative;overflow:hidden;background:#3a3a3a;touch-action:none;cursor:grab;user-select:none}
#cropStage:active{cursor:grabbing}
#cropImg{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
#cropFrame{position:absolute;box-shadow:0 0 0 9999px rgb(40 40 40/.55);outline:1px solid #fafafa;pointer-events:none;
 background:linear-gradient(#fafafa66,#fafafa66) 33.33% 0/1px 100% no-repeat,linear-gradient(#fafafa66,#fafafa66) 66.66% 0/1px 100% no-repeat,linear-gradient(#fafafa66,#fafafa66) 0 33.33%/100% 1px no-repeat,linear-gradient(#fafafa66,#fafafa66) 0 66.66%/100% 1px no-repeat}
.zrow{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px;color:#666}
.zrow input{flex:1;accent-color:var(--acc);min-height:32px}
.cropacts{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
</style>
</head>

<header><h1>角色名冊<small>後台</small></h1><a class="lnk" href="index.html" target="_blank" rel="noopener">查看網站</a><span class="sp"></span><div id="who"></div></header>

const readForm=fm=>{const o={};SCHEMA[fm.dataset.col].forEach(f=>{if(f.t==='image')o[f.k]=img;else{const el=fm.elements[f.k];o[f.k]=f.t==='number'?(+el.value||0):el.value.trim()}});return o};
const resizeImg=file=>new Promise((res,rej)=>{const im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{const Z=320,cv=document.createElement('canvas');cv.width=cv.height=Z;const k=Math.max(Z/im.width,Z/im.height),w=im.width*k,h=im.height*k,g=cv.getContext('2d');g.fillStyle='#fafafa';g.fillRect(0,0,Z,Z);g.drawImage(im,(Z-w)/2,(Z-h)/2,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.85))};im.onerror=()=>rej(new Error('讀不到這張圖片'));im.src=url});
async function save(col,id,data){
 if(id)await api.setDoc(api.doc(api.db,P+COLS[col],id),data,{merge:true});
 else{data.order=Date.now();data.createdAt=api.serverTimestamp();await api.addDoc(api.collection(api.db,P+COLS[col]),data)}
}
async function importSeed(){
 const seeds={chars:seedChars(),co:seedCo(),fam:seedFam(),pj:seedPj()};let batch=api.writeBatch(api.db),n=0;
 for(const k of Object.keys(TITLE)){if(S[k].length)continue;for(const r of seeds[k]){batch.set(api.doc(api.collection(api.db,P+COLS[k])),r);if(++n%400===0){await batch.commit();batch=api.writeBatch(api.db)}}}
 await batch.commit();return n;
}


/* ---------- square cropper ---------- */
function cropImage(file){return new Promise((resolve,reject)=>{
 const url=URL.createObjectURL(file),im=new Image();
 im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('讀不到這張圖片'))};
 im.onload=()=>{
  const W=im.naturalWidth,H=im.naturalHeight,box=$('crop'),stage=$('cropStage'),pic=$('cropImg'),zoom=$('cropZoom');
  pic.src=url;box.classList.add('on');
  let SZ,PAD,base,k,tx,ty;const ptrs=new Map();let last=null,pinch=null;
  const layout=()=>{const sw=stage.clientWidth;PAD=Math.round(sw*.1);SZ=sw-2*PAD;stage.style.height=sw+'px';const f=$('cropFrame');f.style.left=f.style.top=PAD+'px';f.style.width=f.style.height=SZ+'px';base=Math.max(SZ/W,SZ/H)};
  const clamp=()=>{const w=W*k,h=H*k;tx=Math.min(PAD,Math.max(PAD+SZ-w,tx));ty=Math.min(PAD,Math.max(PAD+SZ-h,ty))};
  const draw=()=>{clamp();pic.style.width=W*k+'px';pic.style.height=H*k+'px';pic.style.transform=`translate(${tx}px,${ty}px)`};
  const zoomTo=(nk,cx=PAD+SZ/2,cy=PAD+SZ/2)=>{nk=Math.min(base*5,Math.max(base,nk));const ix=(cx-tx)/k,iy=(cy-ty)/k;k=nk;tx=cx-ix*k;ty=cy-iy*k;zoom.value=k/base;draw()};
  layout();k=base;tx=PAD+(SZ-W*k)/2;ty=PAD+(SZ-H*k)/2;zoom.value=1;draw();
  const pos=e=>{const r=stage.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const down=e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,pos(e));last=pos(e);if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k}}};
  const move=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,pos(e));
   if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];zoomTo(pinch.k*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2);return}
   const p=pos(e);tx+=p[0]-last[0];ty+=p[1]-last[1];last=p;draw()};
  const up=e=>{ptrs.delete(e.pointerId);pinch=null;if(ptrs.size===1)last=[...ptrs.values()][0]};
  const wheel=e=>{e.preventDefault();const [x,y]=pos(e);zoomTo(k*(e.deltaY<0?1.08:1/1.08),x,y)};
  const zin=()=>zoomTo(base*+zoom.value);
  const key=e=>{if(e.key==='Escape')finish(null);if(e.key==='Enter'&&e.target.tagName!=='BUTTON')ok()};
  const ok=()=>{const OUT=400,cv=document.createElement('canvas');cv.width=cv.height=OUT;const g=cv.getContext('2d');g.fillStyle='#fafafa';g.fillRect(0,0,OUT,OUT);g.imageSmoothingQuality='high';
   g.drawImage(im,(PAD-tx)/k,(PAD-ty)/k,SZ/k,SZ/k,0,0,OUT,OUT);finish(cv.toDataURL('image/jpeg',.88))};
  const finish=v=>{box.classList.remove('on');stage.removeEventListener('pointerdown',down);stage.removeEventListener('pointermove',move);stage.removeEventListener('pointerup',up);stage.removeEventListener('pointercancel',up);stage.removeEventListener('wheel',wheel);zoom.removeEventListener('input',zin);document.removeEventListener('keydown',key);$('cropOk').onclick=$('cropCancel').onclick=null;window.removeEventListener('resize',rs);URL.revokeObjectURL(url);pic.removeAttribute('src');resolve(v)};
  const rs=()=>{const cx=(PAD+SZ/2-tx)/k/W,cy=(PAD+SZ/2-ty)/k/H,rel=k/base;layout();k=base*rel;tx=PAD+SZ/2-cx*W*k;ty=PAD+SZ/2-cy*H*k;draw()};
  stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);stage.addEventListener('wheel',wheel,{passive:false});zoom.addEventListener('input',zin);document.addEventListener('keydown',key);window.addEventListener('resize',rs);
  $('cropOk').onclick=ok;$('cropCancel').onclick=()=>finish(null);$('cropOk').focus();
 };
 im.src=url;
})}

async function boot(){
 if(!FIREBASE_CONFIG.apiKey){renderShell();return}
 const base='https://www.gstatic.com/firebasejs/10.12.2/';
 const [A,AU,FS]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
 const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=FS.getFirestore(app);
 api={auth,db,GoogleAuthProvider:AU.GoogleAuthProvider,signInWithPopup:AU.signInWithPopup,signOut:AU.signOut,collection:FS.collection,doc:FS.doc,addDoc:FS.addDoc,setDoc:FS.setDoc,deleteDoc:FS.deleteDoc,writeBatch:FS.writeBatch,serverTimestamp:FS.serverTimestamp};
 online=true;
 let unsub=[];
 AU.onAuthStateChanged(auth,u=>{user=u;unsub.forEach(f=>f());unsub=[];renderShell();
  if(!isOwner())return;
  for(const [k,col] of Object.entries(COLS))unsub.push(FS.onSnapshot(FS.collection(db,P+col),snap=>{S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(k);if(editing[k]&&!S[k].some(x=>x.id===editing[k]))editing[k]=null;renderPane(false)},err=>toast('讀取失敗：'+err.message)));
 });
 renderShell();
}
boot().catch(err=>{$('app').innerHTML=`<div class="center"><h2>後台啟動失敗</h2><p>${esc(err.message)}</p></div>`});

</script>
