<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色名冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: plain and quiet, matching the original sheet: black text on light paper.
   IDEA: the spreadsheet roster: grey year bars, white character cards with a square portrait, a small ✶ tag.
   PICTURE: the portraits themselves; empty slots wait for an image.
   COLOUR and TYPE: white, light greys, black text only; Noto Sans TC throughout.
   LAYOUT: title, sheet tabs, grey year bar, four-up cards (two on phones). */
:root{color-scheme:light;--bg:#fafafa;--card:#fafafa;--ink:#282828;--mute:#888;--line:#ececec;--bar:#d9d9d9;--slot:#f2f2f2}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.sky{padding-bottom:6px;text-align:center}
.sky h1{font:700 clamp(28px,4.5vw,40px)/1.1 "Noto Sans TC",sans-serif;margin:0 0 8px;letter-spacing:.12em}
.sky p{margin:0 auto;color:var(--mute);font-size:14px}

body{background:#e6e6e6}
.shell{display:flex;align-items:flex-start;min-height:100vh;padding:clamp(12px,3vw,32px) clamp(10px,3vw,32px) clamp(12px,3vw,32px) 0}
nav{position:sticky;top:clamp(12px,3vw,32px);z-index:5;flex:none;width:clamp(40px,5vw,50px);padding-top:28px}
nav .wrap{display:flex;flex-direction:column;gap:4px;padding:0}
nav a{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;min-height:116px;padding:14px 0;background:#d9d9d9;color:#777;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.14em;border:1px solid #cfcfcf;border-right:0;border-radius:8px 0 0 8px;box-shadow:-1px 1px 2px rgb(40 40 40/.08);position:relative;margin-right:-1px}
nav a:hover{background:#e3e3e3;color:var(--ink)}
nav a[aria-current=page]{background:var(--card);color:var(--ink);border-color:#d6d6d6;z-index:2}
main.band{flex:1;background:var(--card);border:1px solid #d6d6d6;box-shadow:0 2px 10px rgb(40 40 40/.08);min-height:calc(100vh - 2*clamp(12px,3vw,32px));padding:clamp(20px,4vw,48px) clamp(14px,4vw,48px)}
@media(max-width:600px){nav a{min-height:84px;font-size:12px}}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:6px}
.tools input{flex:0 1 320px;font-size:16px;padding:9px 12px;border:1px solid #ddd;background:#fafafa;color:var(--ink);min-height:44px}
.tools input:focus{border-color:#999;outline:none}
.seg{display:flex;border:1px solid #ddd;background:#fafafa}
.seg button{background:#fafafa;border:0;padding:0 16px;min-height:44px}
.seg button+button{border-left:1px solid #ddd}
.seg button[aria-pressed=true]{background:#555;color:#fafafa}
.count{color:var(--mute);font-size:14px}

.yr{padding:22px 0 6px}
.yr h2,.co h2{background:var(--bar);color:#fafafa;font-weight:700;font-size:14px;line-height:1;padding:6px 8px;margin:0 0 22px;text-align:left}
#view{container-type:inline-size}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px 18px}
@container (min-width:250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (min-width:860px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ch{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;background:var(--card);border:1px solid #e6e6e6;box-shadow:0 1px 2px rgb(40 40 40/.1);text-align:center}
.ch:hover{box-shadow:0 2px 8px rgb(40 40 40/.14)}
.ch:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.av{display:block;aspect-ratio:1;background:var(--slot) center/cover no-repeat;border-bottom:1px solid var(--line)}
.av.none{display:grid;place-items:center;color:#c8c8c8;font-size:12px}
.tag{position:absolute;top:0;right:-1px;width:14px;height:14px;background:#bdbdbd;color:#fafafa;font-size:9px;line-height:14px;text-align:center}
.ch .nm{display:block;padding:5px 5px 4px;border-bottom:1px solid var(--line);min-height:44px}
.ch i{display:block;font-style:normal;font-size:10px;color:#555;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch b{display:block;font-weight:700;font-size:14px;line-height:1.35}
.ch .row{display:block;font-size:11.5px;font-weight:700;color:#444;padding:3px 4px;min-height:25px}
.ch .row+.row{border-top:1px solid var(--line)}
.empty{color:var(--mute);padding:30px 0;text-align:center}

.gate{border:1px solid #ddd;background:#fafafa;padding:28px;text-align:center;max-width:520px;margin:20px auto}
.gate p{margin:0 0 14px}
.btn{background:#444;color:#fafafa;border:0;padding:10px 20px;min-height:44px}
.btn.ghost{background:#fafafa;color:var(--ink);border:1px solid #ccc}

.co{padding:22px 0 6px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;padding:12px;background:#fafafa;border:1px solid #e6e6e6;box-shadow:0 1px 2px rgb(40 40 40/.08);text-align:center}
.pair .x{font-size:12px;color:#aaa;align-self:center}
.mini{display:block;width:56px;aspect-ratio:1;margin:0 auto 6px;background:var(--slot) center/cover no-repeat}
.pair .who b{display:block;font-weight:700;font-size:15px;line-height:1.35}
.pair .who i{display:block;font-style:normal;font-size:11px;color:var(--mute);line-height:1.4}
.pair .who em{display:block;font-style:normal;font-size:12px;margin-top:2px;color:#555}
.pair .tg{grid-column:1/-1;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px}
.link{all:unset;cursor:pointer;border-bottom:1px solid #ccc}
.link:hover{border-color:var(--ink)}
.link:focus-visible{outline:2px solid var(--ink)}
h3.sub{font-weight:700;font-size:18px;margin:40px 0 0;text-align:center}

.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.pj{padding:14px 12px;background:#fafafa;border:1px solid #e6e6e6;box-shadow:0 1px 2px rgb(40 40 40/.08);text-align:center}
.pj .m{font-size:12px;color:var(--mute)}
.pj h4{font-weight:700;font-size:16px;margin:2px 0 8px}
.pj ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px}
.pj li{font-size:14px}
.vt{list-style:none;margin:10px auto 0;padding:0 0 0 22px;max-width:560px;position:relative}
.vt::before{content:"";position:absolute;left:3px;top:12px;bottom:42px;width:1px;background:#bdbdbd}
.vt li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:16px;padding:0 0 30px;position:relative}
.vt li::before{content:"";position:absolute;left:-22px;top:9px;width:7px;height:7px;border-radius:50%;background:#666}
.vt .dt{font-size:16px;color:#444;line-height:1.5}.vt .dt small{font-size:13px;color:var(--mute)}
.vt h4{margin:0;font-size:17px;font-weight:700;line-height:1.5}
.vt p{margin:2px 0 0;font-size:14px;color:#666}
.pjt{max-width:1000px;margin:6px auto 0}
.pjy{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0 36px;padding:6px 0 18px}
.pjy h2{margin:0;align-self:start;background:#d9d9d9;color:#fafafa;font-size:19px;font-weight:700;letter-spacing:.14em;text-align:center;line-height:1;padding:5px 0}
.pjg{display:flex;flex-wrap:wrap;gap:22px 40px}
.pjc{margin:0;display:flex;flex-direction:column;align-items:center}
.faces{display:flex}
.face{all:unset;box-sizing:border-box;width:90px;height:90px;background:#ececec center/cover no-repeat;cursor:pointer;display:grid;place-items:center;align-content:center;font-size:11px;color:#999;text-align:center;line-height:1.3;padding:4px}
.face.blank{border:1px solid #e2e2e2}.face+.face.blank{border-left:0}
span.face{cursor:default}.face small{display:block;font-size:9px;color:#bbb}
.face:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
button.face:hover{filter:brightness(1.06)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pjc figcaption{margin-top:8px;font-size:12px;font-weight:700;color:#aaa;letter-spacing:.18em;text-align:center;line-height:1.4}
.pjc figcaption small{display:block;font-size:10px;font-weight:400;letter-spacing:.1em;color:#bbb}
@media(max-width:600px){.pjy{grid-template-columns:minmax(0,1fr);gap:12px}.pjy h2{justify-self:start;padding:5px 12px}.pjg{gap:18px 22px}.face{width:64px;height:64px;font-size:10px}}
.sh{margin:6px 0 34px}
.shh{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:10px 18px;background:#d9d9d9;padding:5px 8px;margin-bottom:12px}
.shh h2{margin:0;color:#fafafa;font-size:14px;font-weight:700;letter-spacing:.12em}
.shf{display:flex;gap:8px;flex-wrap:wrap}
.seg.sm{border:0;background:none;gap:2px}.seg.sm button{background:#fafafa;border:0;min-height:30px;padding:0 10px;font-size:12px}.seg.sm button+button{border:0}
.seg.sm button[aria-pressed=true]{background:#555;color:#fafafa}
.shnote{font-size:13px;color:var(--mute);margin:0 0 10px}
.hr{list-style:none;margin:0;padding:0;columns:2 420px;column-gap:40px}
.hr li{break-inside:avoid;display:grid;grid-template-columns:2.2em minmax(0,11em) minmax(0,1fr) 4.6em;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rk{font-size:13px;font-weight:700;color:#aaa;text-align:right}
.hrn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0}
.hrn:focus-visible{outline:2px solid var(--ink)}
.hrn .mini{width:30px;height:30px;margin:0;flex:none}
.nm2{display:flex;flex-direction:column;min-width:0}.nm2 b{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm2 i{font-style:normal;font-size:11px;color:var(--mute)}
.bar{height:8px;background:#efefef}.bar span{display:block;height:100%;background:#aaa55a}
.cm{font-size:14px;font-weight:700;text-align:right;white-space:nowrap}.cm small{font-weight:400;color:var(--mute);font-size:11px}
.sh2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:0 40px}
.ratio{display:flex;height:34px;font-size:13px;font-weight:700;color:#fafafa}
.ratio span{display:flex;align-items:center;padding:0 10px;white-space:nowrap;min-width:max-content}
.rf{background:#aaa55a}.rm{background:#555}.ru{background:#cfcfcf;color:#555}
.lg{font-size:12px;color:#fafafa;display:flex;align-items:center;gap:5px}.lg i{display:inline-block;width:10px;height:10px}
.k1{background:#555}.k2{background:#aaa55a}
.yrs{list-style:none;margin:0;padding:0}
.yrs li{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2em;align-items:center;gap:10px;padding:3px 0}
.yrs .y{font-size:13px;color:#666}.yrs .n{font-size:13px;font-weight:700;text-align:right}
.st{display:flex;height:12px;background:#f1f1f1}.st span{display:block;height:100%}
@media(max-width:600px){.hr li{grid-template-columns:1.8em minmax(0,1fr) 4.4em}.hr .bar{grid-column:2/4;grid-row:2;margin-left:38px}}
@media(min-width:900px){main.band{padding-right:max(48px,calc(clamp(14px,4vw,56px) + 80px))}}
.hchart{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,14px)}
.hrow{display:grid;grid-template-columns:clamp(18px,2.2vw,26px) minmax(0,1fr) 2em;gap:clamp(10px,2vw,22px);align-items:start}
.hsw{display:block;aspect-ratio:1;border:1px solid #e6e6e6}
.hcells{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(4px,1vw,12px)}
.hc{all:unset;box-sizing:border-box;aspect-ratio:1;background:#f3f3f3 center/cover no-repeat;display:grid;place-items:center;font-size:10px;color:#999;text-align:center;line-height:1.2;padding:2px;overflow:hidden;cursor:pointer}
.hc.blank{border:1px solid #e2e2e2}.hc.empty{cursor:default;background:#f6f6f6}
.hc:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hn{font-size:12px;color:#aaa;font-weight:700;padding-top:2px}
@container (max-width:620px){.hcells{grid-template-columns:repeat(6,minmax(0,1fr))}}
.htab{display:flex;flex-direction:column;gap:18px}
.htrow{display:flex;align-items:flex-start;gap:clamp(4px,1vw,12px)}
.hgrp{flex:1;display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:clamp(4px,1vw,12px);align-items:start}
.hgrp:last-child{grid-template-columns:repeat(5,minmax(0,1fr)) auto}
.hsx{flex:none;font-size:13px;font-weight:700;color:#fafafa;background:#bdbdbd;width:22px;height:22px;display:grid;place-items:center;margin-right:clamp(4px,1.4vw,14px)}
.hend{font-size:12px;font-weight:700;color:#aaa;writing-mode:vertical-rl;letter-spacing:.2em;padding-top:4px}
.hdots{color:#c8c8c8;align-self:center;font-size:16px;margin-top:-14px}
.hcol{display:flex;flex-direction:column;align-items:stretch}
.hk{text-align:center;font-size:11px;font-weight:700;color:#aaa;margin-top:4px;min-height:1.4em}
@container (max-width:560px){.htrow{flex-wrap:wrap}.hsx{margin:0 0 2px}.hgrp{flex:0 0 100%}.hdots{display:none}}
.npc{font-size:12px;color:var(--mute)}

#ov{position:fixed;inset:0;background:rgb(250 250 250/.85);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#ov.on{display:flex}
#dlg{background:#fafafa;color:var(--ink);border:1px solid #e0e0e0;box-shadow:0 6px 30px rgb(40 40 40/.12);width:min(440px,100%);max-height:90vh;overflow:auto;padding:26px 24px 20px;position:relative;text-align:center}
#dlg .close{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--mute)}
#dlg .big{width:min(240px,70%);aspect-ratio:1;margin:8px auto 10px;background:var(--slot) center/cover no-repeat;display:grid;place-items:center;color:#bbb;font-size:13px;border:1px solid var(--line)}
#dlg .avbtns{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
#dlg .avbtns .btn{padding:6px 14px;font-size:14px}
#dlg .kind{font-size:12px;color:var(--mute)}
#dlg h2{font-weight:700;font-size:26px;line-height:1.2;margin:2px 0 0}
#dlg .rd{color:#555;font-size:13px;margin:0}
#dlg .stat{margin:4px 0 0;font-weight:700;font-size:14px}
#dlg h5{font-size:12px;color:var(--mute);margin:16px 0 6px;font-weight:400;border-top:1px solid var(--line);padding-top:12px}
#dlg ul{margin:0;padding:0;list-style:none;font-size:14px}#dlg li{margin:4px 0}
.grid .ch{max-width:260px;justify-self:center;width:100%}

/* acrylic charm */
.charm{position:fixed;top:0;right:clamp(14px,4vw,56px);z-index:15;width:92px;border:0;background:none;padding:0;transform-origin:46px 0;filter:drop-shadow(5px 8px 5px rgb(170 165 90/.35))}
.charm svg{display:block;width:100%;height:auto}
.charm:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.charm.swing{animation:swing 1.1s ease-out}
@keyframes swing{0%{transform:rotate(0)}20%{transform:rotate(7deg)}45%{transform:rotate(-5deg)}70%{transform:rotate(2.5deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.charm.swing{animation:none}}
#ovw{position:fixed;top:24px;right:calc(clamp(14px,4vw,56px) + 104px);z-index:16;width:min(300px,calc(100vw - 130px));max-height:min(72vh,620px);overflow:auto;background:var(--card);border:1px solid #d6d6d6;box-shadow:0 8px 28px rgb(40 40 40/.14);padding:16px 18px;display:none}
#ovw.on{display:block}
#ovw h3{margin:0 0 4px;font-size:15px;letter-spacing:.12em;color:#aaa55a}
#ovw h4{margin:12px 0 4px;font-size:12px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:3px}
#ovw p{margin:0;font-size:14px;line-height:1.9}
#ovw .link{font-size:14px}
@media(max-width:600px){.charm{width:56px;transform-origin:28px 0}#ovw{right:12px;top:150px;width:calc(100vw - 24px);max-height:60vh}}

main.band{position:relative}
#dlg{width:min(480px,100%)}

</style>
</head>
<body>
<button class="charm" id="charm" aria-expanded="false" aria-controls="ovw" aria-label="打開本頁角色總覽">
<svg viewBox="0 0 78 210" aria-hidden="true">
 <defs>
  <linearGradient id="acr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4bf7a"/><stop offset=".55" stop-color="#aaa55a"/><stop offset="1" stop-color="#97924c"/></linearGradient>
  <clipPath id="tagc"><rect x="9" y="88" width="60" height="114" rx="30"/></clipPath>
 </defs>
 <!-- lobster clasp -->
 <path d="M39 4c-10 0-15 7-15 15s5 15 15 15 15-7 15-15" fill="none" stroke="#aaa55a" stroke-width="7" stroke-linecap="round"/>
 <path d="M54 19c0-6-3-11-8-13" fill="none" stroke="#c4bf7a" stroke-width="3" stroke-linecap="round"/>
 <rect x="33" y="31" width="12" height="9" rx="3" fill="#aaa55a"/>
 <!-- clear chain -->
 <rect x="32" y="38" width="14" height="20" rx="7" fill="rgb(250 250 250/.45)" stroke="#d2d2d2" stroke-width="3"/>
 <rect x="37" y="52" width="4" height="20" rx="2" fill="rgb(250 250 250/.6)" stroke="#cfcfcf" stroke-width="2"/>
 <rect x="32" y="66" width="14" height="20" rx="7" fill="rgb(250 250 250/.45)" stroke="#d2d2d2" stroke-width="3"/>
 <!-- jump ring -->
 <circle cx="39" cy="89" r="5.5" fill="none" stroke="#bdbdbd" stroke-width="2"/>
 <!-- acrylic tag -->
 <rect x="9" y="88" width="60" height="114" rx="30" fill="url(#acr)" opacity=".88"/>
 <g clip-path="url(#tagc)" fill="none" stroke="#fafafa" stroke-width="1.4" opacity=".55">
  <path d="M0 120c14-6 26 6 40 0s26-6 40 0"/><path d="M0 150c14-6 26 6 40 0s26-6 40 0"/><path d="M0 180c14-6 26 6 40 0s26-6 40 0"/>
 </g>
 <rect x="10.5" y="89.5" width="57" height="111" rx="28.5" fill="none" stroke="#fafafa" stroke-opacity=".5" stroke-width="1.5"/>
 <circle cx="39" cy="97" r="3" fill="#e6e6e6"/>
 <text x="39" y="124" text-anchor="middle" fill="#fafafa" font-size="17">✶</text>
 <text id="charmT" x="39" y="152" text-anchor="middle" fill="#282828" font-size="12" font-weight="700" letter-spacing="1.5">ᴏᴄ</text>
 <text id="charmN" x="39" y="170" text-anchor="middle" fill="#282828" font-size="10">69</text>
 <text x="39" y="186" text-anchor="middle" fill="#fafafa" font-size="7" letter-spacing="1">ɪɴᴅᴇx</text>
</svg></button>
<div id="ovw" role="dialog" aria-label="本頁角色總覽"></div>
<div class="shell"><nav aria-label="分頁"><div class="wrap" id="tabs">
<a href="#oc">ᴏᴄ</a><a href="#trpg">ᴛʀᴘɢ</a><a href="#co">ᴄᴏ</a><a href="#project">ᴘʀᴏᴊᴇᴄᴛ</a><a href="#sheet">𝗦𝗛𝗘𝗘𝗧</a></div></nav>
<main class="band"><div class="wrap"><div id="view"></div></div></main></div>
<div id="ov" role="dialog" aria-modal="true" aria-labelledby="dn"><div id="dlg"></div></div>
<script type="module">
// 角色名冊・展示頁：只讀取資料庫並顯示，資料請到 admin.html 後台編輯
// 連線設定放在同一個資料夾的 config.js
let FIREBASE_CONFIG={};
try{const m=await import('./config.js');FIREBASE_CONFIG=m.firebaseConfig||{}}catch(e){}
const P="roster_";
const COLS={chars:'characters',co:'co',pj:'projects',fam:'family'};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').replace(/\(NPC\)/g,'').replace(/[\s・·•＆&()（）]/g,'');
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
const S={chars:[],co:[],fam:[],pj:[]};
let trOpen=false,ready=false;
try{trOpen=sessionStorage.getItem('trOpen')==='1'}catch(e){}

/* ---------- derived ---------- */
const chars=t=>S.chars.filter(c=>c.type===t).sort((a,b)=>b.year-a.year||a.order-b.order);
const byId=id=>S.chars.find(c=>c.id===id);
const matchName=(c,s)=>{const n=norm(c.name),p=norm(s);return !!p&&(p===n||(p.length>=2&&n.endsWith(p)))};
const findChar=s=>S.chars.find(c=>norm(c.name)===norm(s))||S.chars.find(c=>matchName(c,s));
const castList=pj=>String(pj.cast||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);
const monthNum=m=>parseInt(m)||0;
const pjSorted=()=>[...S.pj].sort((a,b)=>b.year-a.year||monthNum(b.month)-monthNum(a.month)||b.order-a.order);
const coSorted=()=>[...S.co].sort((a,b)=>a.order-b.order);
const famMembers=f=>String(f.members||'').split('\n').map(l=>l.split('｜')).filter(m=>m.some(x=>x&&x.trim()));
const coOf=c=>S.co.filter(x=>String(x.a).split('＆').some(s=>norm(s)===norm(c.name)));
const pjOf=c=>pjSorted().filter(p=>castList(p).some(s=>matchName(c,s)));
const famOf=c=>S.fam.filter(f=>famMembers(f).some(m=>m[0]&&(norm(m[0])===norm(c.name)||norm(m[0]).startsWith(norm(c.name)))));
const stat=c=>`${c.sex||'-'} / ${!c.age?'-':c.age==='-'||c.age==='?'?c.age:c.age+'y'} / ${!c.height||c.height==='-'?'-':c.height} cm`;
const bg=u=>u?` style="background-image:url('${u}')"`:'';

/* ---------- views ---------- */
const view=$('view');
const card=c=>`<button class="ch" data-id="${c.id}"><span class="av ${c.avatar?'':'none'}"${bg(c.avatar)}>${c.avatar?'':'頭貼'}</span><span class="tag" aria-hidden="true">${c.type==='trpg'?'✱':'✶'}</span><span class="nm">${c.reading?`<i>${esc(c.reading)}</i>`:''}<b>${esc(c.name)}</b></span><span class="row">${esc(stat(c))}</span><span class="row">${esc(c.job)}</span></button>`;
const roster=list=>{const ys=[...new Set(list.map(c=>c.year))];
 return ys.length?ys.map(y=>`<section class="yr"><h2>${y}</h2><div class="grid">${list.filter(c=>c.year===y).map(card).join('')}</div></section>`).join(''):`<p class="empty">還沒有角色。</p>`};
const who=(n,r,role)=>{const c=n&&String(n).split('＆').length===1?findChar(n):null;
 const name=n?(c?`<button class="link" data-id="${c.id}">${esc(n)}</button>`:esc(n)):'<span class="npc">未填名</span>';
 return `<div class="who"><span class="mini"${c?bg(c.avatar):''}></span><b>${name}</b>${r?`<i>${esc(r)}</i>`:''}${role?`<em>${esc(role)}</em>`:''}</div>`};
const coView=()=>{const list=coSorted(),ps=[...new Set(list.map(x=>x.partner))],fam=[...S.fam].sort((a,b)=>a.order-b.order);
 if(!list.length&&!fam.length)return `<p class="empty">還沒有配對資料。</p>`;
 return ps.map(p=>`<section class="co"><h2>${esc(p)||'未分組'}</h2><div class="pairs">${list.filter(x=>x.partner===p).map(x=>`<div class="pair">${who(x.a,x.ar,x.arl)}<span class="x" aria-hidden="true">✶</span>${who(x.b,x.br,x.brl)}${x.tag?`<div class="tg">${esc(x.tag)}</div>`:''}</div>`).join('')}</div></section>`).join('')+
 (fam.length?`<h3 class="sub">家族</h3>`+fam.map(f=>`<section class="co"><h2>${esc(f.name)}</h2><div class="pairs">${famMembers(f).map(m=>`<div class="pair" style="grid-template-columns:minmax(0,1fr)">${who(m[0],m[1],m[2])}</div>`).join('')}</div></section>`).join(''):'');
};
const pjFace=s=>{const npc=/NPC/.test(s),n=s.replace(/\s*\(NPC\)/,''),c=npc?null:findChar(n);
 return c?`<button class="face${c.avatar?'':' blank'}" data-id="${c.id}" title="${esc(c.name)}"${bg(c.avatar)}>${c.avatar?`<span class="sr">${esc(c.name)}</span>`:esc(c.name)}</button>`:`<span class="face blank" title="${esc(n)}${npc?'（NPC）':''}">${esc(n)}${npc?'<small>NPC</small>':''}</span>`};
const pjView=()=>{if(!S.pj.length)return `<p class="empty">還沒有企劃資料。</p>`;const L=pjSorted(),ys=[...new Set(L.map(p=>p.year))];
 return `<div class="pjt">${ys.map(y=>`<section class="pjy"><h2>${y}</h2><div class="pjg">${L.filter(p=>p.year===y).map(p=>`<figure class="pjc"><div class="faces">${castList(p).map(pjFace).join('')}</div><figcaption>${p.month?`<small>${esc(p.month)}</small>`:''}${esc(p.name||'企劃名未填')}</figcaption></figure>`).join('')}</div></section>`).join('')}</div>`};
const gate=()=>`<div class="gate"><p style="font-size:18px">⚠️ TRPG 角卡可能會劇透</p><p>角卡裡的身分與經歷可能洩漏模組內容。確定要看再打開。</p><button class="btn" id="openTr">顯示 TRPG 角卡</button></div>`;


/* ---------- sheet ---------- */
let hf={type:'all',sex:'all'};
const hNum=c=>{const v=parseFloat(c.height);return isFinite(v)&&v>0?v:null};
const seg=(key,cur,opts)=>`<div class="seg sm" role="group">${opts.map(([k,t])=>`<button data-hf="${key}:${k}" aria-pressed="${cur===k}">${t}</button>`).join('')}</div>`;
const hCell=(c,rk)=>c?`<button class="hc${c.avatar?'':' blank'}" data-id="${c.id}" title="${esc(c.name)}　${hNum(c)} cm"${bg(c.avatar)}>${c.avatar?`<span class="sr">${esc(c.name)} ${hNum(c)} cm</span>`:esc(c.name)}</button><span class="hk">${rk}</span>`:`<span class="hc empty"></span><span class="hk"></span>`;
const heightRow=sex=>{const L=S.chars.filter(c=>c.sex===sex&&hNum(c)!==null).sort((a,b)=>hNum(b)-hNum(a)||a.name.localeCompare(b.name));
 const tall=L.slice(0,5),short=L.slice(Math.max(5,L.length-5)).reverse();
 const T=[0,1,2,3,4].map(i=>`<div class="hcol">${hCell(tall[i],i+1)}</div>`).join(''),Sh=[4,3,2,1,0].map(i=>`<div class="hcol">${hCell(short[i],i+1)}</div>`).join('');
 return `<div class="htrow"><span class="hsx">${sex}</span><div class="hgrp"><span class="hend">高</span>${T}</div><span class="hdots">⋯</span><div class="hgrp">${Sh}<span class="hend">矮</span></div></div>`};

const HAIR=[['red','紅・粉','#e3a3a3'],['orange','橘・棕','#e4cba1'],['yellow','黃・金','#e5e3a3'],['green','綠','#a8dcb0'],['blue','藍','#a3a5e3'],['purple','紫','#d0a3e3'],['black','黑・灰','#888888'],['white','白・銀','#fafafa']];
let hairT='all';
const hairChart=()=>{const L=S.chars.filter(c=>c.hair&&(hairT==='all'||c.type===hairT)).sort((a,b)=>b.year-a.year||a.order-b.order);
 const unset=S.chars.filter(c=>!c.hair&&(hairT==='all'||c.type===hairT)).length;
 const rows=HAIR.map(h=>{const M=L.filter(c=>c.hair===h[0]),fill=Math.max(12,Math.ceil(M.length/12)*12)-M.length;
  return `<div class="hrow"><span class="hsw" style="background:${h[2]}" title="${h[1]}"><span class="sr">${h[1]}</span></span><div class="hcells">${M.map(c=>`<button class="hc${c.avatar?'':' blank'}" data-id="${c.id}" title="${esc(c.name)}"${bg(c.avatar)}>${c.avatar?`<span class="sr">${esc(c.name)}</span>`:esc(c.name)}</button>`).join('')}${'<span class="hc empty"></span>'.repeat(fill)}</div><span class="hn">${M.length}</span></div>`}).join('');
 return `<section class="sh"><div class="shh"><h2>髮色排行榜</h2><div class="shf"><div class="seg sm" role="group">${[['all','全部'],['oc','ᴏᴄ'],['trpg','ᴛʀᴘɢ']].map(([k,t])=>`<button data-hairt="${k}" aria-pressed="${hairT===k}">${t}</button>`).join('')}</div></div></div>${L.length?'':'<p class="shnote">還沒有角色設定髮色，請到後台的「髮色」分頁設定。</p>'}<div class="hchart">${rows}</div>${unset&&L.length?`<p class="shnote">另有 ${unset} 位尚未設定髮色。</p>`:''}</section>`};
const sheetView=()=>{
 const all=S.chars,withH=all.filter(c=>hNum(c)!==null),avg=a=>a.length?(a.reduce((x,c)=>x+hNum(c),0)/a.length).toFixed(1):'—';
 const F=all.filter(c=>c.sex==='F').length,M=all.filter(c=>c.sex==='M').length,U=all.length-F-M;
 const ys=[...new Set(all.map(c=>c.year))].sort((a,b)=>b-a),ymax=Math.max(1,...ys.map(y=>all.filter(c=>c.year===y).length));
 return `<section class="sh"><div class="shh"><h2>身高排行榜</h2></div><div class="htab">${heightRow('M')}${heightRow('F')}</div></section>
 ${hairChart()}
 <div class="sh2">
 <section class="sh"><div class="shh"><h2>男女比例</h2></div><div class="ratio">${F?`<span class="rf" style="flex:${F}">F ${F}</span>`:''}${M?`<span class="rm" style="flex:${M}">M ${M}</span>`:''}${U?`<span class="ru" style="flex:${U}">${U}</span>`:''}</div><p class="shnote">${U?`另有 ${U} 位未填性別。`:''}</p></section>
 <section class="sh"><div class="shh"><h2>每年角色數</h2><span class="lg"><i class="k1"></i>ᴏᴄ <i class="k2"></i>ᴛʀᴘɢ</span></div><ul class="yrs">${ys.map(y=>{const o=all.filter(c=>c.year===y&&c.type==='oc').length,t=all.filter(c=>c.year===y&&c.type==='trpg').length;return `<li><span class="y">${y}</span><span class="st"><span class="k1" style="width:${o/ymax*100}%"></span><span class="k2" style="width:${t/ymax*100}%"></span></span><span class="n">${o+t}</span></li>`}).join('')}</ul></section>
 </div>`};

const LABEL={oc:'ᴏᴄ',trpg:'ᴛʀᴘɢ',co:'ᴄᴏ',project:'ᴘʀᴏᴊᴇᴄᴛ',sheet:'𝗦𝗛𝗘𝗘𝗧'};
const curRoute=()=>LABEL[location.hash.slice(1)]?location.hash.slice(1):'oc';
function render(){
 const r=curRoute();
 document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+r?'page':'false'));
 view.innerHTML=ready?{oc:()=>roster(chars('oc')),trpg:()=>trOpen?roster(chars('trpg')):gate(),co:coView,project:pjView,sheet:sheetView}[r]():'<p class="empty">讀取中…</p>';
 syncCharm();
}

/* ---------- detail dialog ---------- */
const ov=$('ov'),dlg=$('dlg');let lastFocus=null,curId=null;
function openChar(id){
 const c=byId(id);if(!c)return;if(!ov.classList.contains('on'))lastFocus=document.activeElement;curId=id;
 const co=coOf(c),pj=pjOf(c),fam=famOf(c);
 dlg.innerHTML=`<button class="close" aria-label="關閉">✕</button>
 <div class="kind">${c.type==='oc'?'✶ ᴏᴄ':'✱ ᴛʀᴘɢ'}　${c.year}</div>
 <div class="big"${bg(c.avatar)}>${c.avatar?'':'尚未放頭貼'}</div>
 ${c.reading?`<p class="rd">${esc(c.reading)}</p>`:''}<h2 id="dn">${esc(c.name)}</h2>
 <p class="stat">${esc(stat(c))}</p>${c.job?`<p class="stat">${esc(c.job)}</p>`:''}
 ${co.length?`<h5>CO 配對</h5><ul>${co.map(x=>`<li>${x.arl?esc(x.arl)+'，':''}與 <b>${esc(x.b||'未填名')}</b>${x.brl?`（${esc(x.brl)}）`:''}${x.tag?`　<span class="npc">${esc(x.tag)}</span>`:''}<br><span class="npc">合作：${esc(x.partner)}</span></li>`).join('')}</ul>`:''}
 ${fam.length?`<h5>家族</h5><ul>${fam.map(f=>`<li>${esc(f.name)} 家：${famMembers(f).map(m=>`${esc(m[0]||'未填名')}（${esc(m[2]||'')}）`).join('、')}</li>`).join('')}</ul>`:''}
 ${pj.length?`<h5>參加企劃</h5><ul>${pj.map(p=>`<li>${p.year} ${esc(p.month)}　${esc(p.name||'企劃名未填')}</li>`).join('')}</ul>`:''}`;
 ov.classList.add('on');dlg.scrollTop=0;dlg.querySelector('.close').focus();
}
const closeDlg=()=>{ov.classList.remove('on');curId=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()};

/* ---------- charm overview ---------- */
const charm=$('charm'),ovw=$('ovw');
const nameLink=c=>`<button class="link" data-id="${c.id}">${esc(c.name)}</button>`;
const nm=s=>{const c=s&&String(s).split('＆').length===1?findChar(s):null;return c?nameLink(c):esc(s||'未填名')};
const ovwHTML=r=>{
 if(r==='oc'||r==='trpg'){const L=chars(r);if(r==='trpg'&&!trOpen)return `<h3>${LABEL[r]}</h3><p class="npc">TRPG 角卡可能會劇透，先在頁面上打開再看總覽。</p>`;
  return `<h3>${LABEL[r]}　${L.length}</h3>`+[...new Set(L.map(c=>c.year))].map(y=>`<h4>${y}</h4><p>${L.filter(c=>c.year===y).map(nameLink).join('、')}</p>`).join('')}
 if(r==='co'){const L=coSorted();return `<h3>${LABEL[r]}　${L.length}</h3>`+[...new Set(L.map(x=>x.partner))].map(p=>`<h4>${esc(p)}</h4><p>${L.filter(x=>x.partner===p).map(x=>`${nm(x.a)} ✶ ${esc(x.b||'未填名')}`).join('<br>')}</p>`).join('')+(S.fam.length?`<h4>家族</h4><p>${S.fam.map(f=>famMembers(f).filter(m=>m[0]).map(m=>nm(m[0])).join('、')).join('<br>')}</p>`:'')}
 if(r==='sheet'){const L=S.chars.filter(c=>hNum(c)!==null).sort((a,b)=>hNum(b)-hNum(a));return `<h3>${LABEL[r]}</h3><h4>身高排行榜</h4><p>${L.slice(0,20).map((c,i)=>`${i+1}. ${nameLink(c)} ${hNum(c)}`).join('<br>')}${L.length>20?'<br>…':''}</p>`}
 return `<h3>${LABEL[r]}</h3>`+pjSorted().map(i=>`<h4>${i.year} ${esc(i.month)}　${esc(i.name||'企劃名未填')}</h4><p>${castList(i).map(s=>nm(s.replace(/\s*\(NPC\)/,''))).join('、')}</p>`).join('');
};
const countOf=r=>r==='oc'?chars('oc').length:r==='trpg'?chars('trpg').length:r==='co'?S.co.length:r==='sheet'?S.chars.filter(c=>hNum(c)!==null).length:S.pj.length;
function syncCharm(){const r=curRoute();$('charmT').textContent=LABEL[r];$('charmN').textContent=countOf(r);if(ovw.classList.contains('on'))ovw.innerHTML=ovwHTML(r)}
function setOvw(on){ovw.classList.toggle('on',on);charm.setAttribute('aria-expanded',on);if(on)ovw.innerHTML=ovwHTML(curRoute())}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 const ht=t.closest('[data-hairt]');if(ht){hairT=ht.dataset.hairt;render();return}
 const hb=t.closest('[data-hf]');if(hb){const [k,v]=hb.dataset.hf.split(':');hf[k]=v;render();return}
 if(t.id==='openTr'){trOpen=true;try{sessionStorage.setItem('trOpen','1')}catch(err){}render();return}
 if(ov.classList.contains('on')&&(t===ov||t.closest('#dlg .close'))){closeDlg();return}
 if(t.closest('#charm')){charm.classList.remove('swing');void charm.offsetWidth;charm.classList.add('swing');setOvw(!ovw.classList.contains('on'));return}
 const c=t.closest('[data-id]');if(c){openChar(c.dataset.id);return}
 if(ovw.classList.contains('on')&&!t.closest('#ovw')&&!ov.contains(t))setOvw(false);
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(ov.classList.contains('on'))closeDlg();else if(ovw.classList.contains('on')){setOvw(false);charm.focus()}});
window.addEventListener('hashchange',render);

/* ---------- boot ---------- */
async function boot(){
 if(!FIREBASE_CONFIG.apiKey){ready=true;render();view.innerHTML='<p class="empty">網站尚未設定資料來源。</p>';console.info('找不到 config.js 的 Firebase 設定');return}
 const base='https://www.gstatic.com/firebasejs/10.12.2/';
 const [A,FS]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
 const db=FS.getFirestore(A.initializeApp(FIREBASE_CONFIG));
 const loaded=new Set();render();
 for(const [k,col] of Object.entries(COLS)){
  FS.onSnapshot(FS.collection(db,P+col),snap=>{
   S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(k);if(loaded.size>=4)ready=true;
   if(ready){render();if(curId&&ov.classList.contains('on')){byId(curId)?openChar(curId):closeDlg()}}
  },err=>{view.innerHTML=`<p class="empty">讀取失敗：${esc(err.message)}</p>`});
 }
}
boot().catch(err=>{view.innerHTML=`<p class="empty">網站啟動失敗：${esc(err.message)}</p>`});

</script>
</body>
</html>
